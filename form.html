<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

<center>
    <h1>Student Registration Form</h1>

    <form>

        <table cellpadding="10">

            <tr>
                <td>Roll No.</td>
                <td><input type="text" size="50"></td>
            </tr>

            <tr>
                <td>Student Name</td>
                <td>
                    <input type="text" placeholder="First Name">
                    <input type="text" placeholder="Last Name">
                </td>
            </tr>

            <tr>
                <td>Father's Name</td>
                <td><input type="text" size="50"></td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="text" placeholder="DD" size="3">
                    <input type="text" placeholder="MM" size="3">
                    <input type="text" placeholder="YYYY" size="5">
                    (DD-MM-YYYY)
                </td>
            </tr>

            <tr>
                <td>Mobile No.</td>
                <td>
                    <input type="text" value="+91" size="3">
                    <input type="text" size="40">
                </td>
            </tr>

            <tr>
                <td>Email ID</td>
                <td><input type="email" size="50"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password" size="50"></td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Department</td>
                <td>
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                    <input type="checkbox"> Mech
                </td>
            </tr>

            <tr>
                <td>Course</td>
                <td>
                    <select>
                        <option selected disabled>--Select Current Course--</option>
                        <option>B.Tech</option>
                        <option>BCA</option>
                        <option>MCA</option>
                        <option>B.Sc</option>
                        <option>M.Tech</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Student Photo</td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td>City</td>
                <td><input type="text" size="50"></td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea rows="5" cols="40"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                </td>
            </tr>

        </table>

    </form>
</center>

</body>
</html>
